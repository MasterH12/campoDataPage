<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 416">
<!-- Panel ilustrado de CampoData. Es una ilustración, no un dato: sin números ni ejes con valores. -->
<style>
@media (prefers-reduced-motion: no-preference) {
.linea { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trazar 2s cubic-bezier(.4, 0, .2, 1) .4s forwards; }
.area { opacity: 0; animation: aparecer 1s ease-out 1.6s forwards; }
.barra { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); animation: crecer .7s cubic-bezier(.2, .7, .2, 1) forwards; }
.b1 { animation-delay: .5s; } .b2 { animation-delay: .6s; } .b3 { animation-delay: .7s; }
.b4 { animation-delay: .8s; } .b5 { animation-delay: .9s; } .b6 { animation-delay: 1s; }
.b7 { animation-delay: 1.1s; } .b8 { animation-delay: 1.2s; }
.dato { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: crecer-x .9s cubic-bezier(.2, .7, .2, 1) forwards; }
.d1 { animation-delay: .3s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .6s; }
.punto, .vivo { opacity: 0; animation: aparecer .4s ease-out 2.3s forwards; }
.pulso { transform-box: fill-box; transform-origin: center; animation: latir 2.2s ease-out 2.4s infinite; opacity: 0; }
.vivo-pulso { transform-box: fill-box; transform-origin: center; animation: latir 2.2s ease-out infinite; }
}
@keyframes trazar { to { stroke-dashoffset: 0; } }
@keyframes aparecer { to { opacity: 1; } }
@keyframes crecer { to { transform: scaleY(1); } }
@keyframes crecer-x { to { transform: scaleX(1); } }
@keyframes latir { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
</style>
<defs>
<linearGradient id="relleno" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#53B0FD" stop-opacity=".38"/>
<stop offset="1" stop-color="#53B0FD" stop-opacity="0"/>
</linearGradient>
<linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
</linearGradient>
</defs>
<rect x="1" y="1" width="518" height="414" rx="22" fill="#0D2A44" stroke="url(#borde)" stroke-width="1.5"/>
<!-- Barra superior: tres puntos, el nombre del panel y "en vivo". -->
<circle cx="26" cy="26" r="5" fill="#FCCB04"/>
<circle cx="44" cy="26" r="5" fill="#72C93C"/>
<circle cx="62" cy="26" r="5" fill="#53B0FD"/>
<rect x="86" y="21" width="132" height="10" rx="5" fill="#FFFFFF" fill-opacity=".2"/>
<rect x="414" y="15" width="82" height="22" rx="11" fill="#72C93C" fill-opacity=".14"/>
<circle class="vivo-pulso" cx="428" cy="26" r="4" fill="#72C93C"/>
<circle cx="428" cy="26" r="4" fill="#72C93C"/>
<rect x="440" y="22" width="44" height="8" rx="4" fill="#72C93C" fill-opacity=".7"/>
<path d="M1 52H519" stroke="#FFFFFF" stroke-opacity=".08"/>
<!-- Tres indicadores: un rótulo y una barra de valor por color. -->
<rect x="24" y="70" width="148" height="66" rx="12" fill="#FFFFFF" fill-opacity=".05"/>
<rect x="186" y="70" width="148" height="66" rx="12" fill="#FFFFFF" fill-opacity=".05"/>
<rect x="348" y="70" width="148" height="66" rx="12" fill="#FFFFFF" fill-opacity=".05"/>
<rect x="40" y="86" width="64" height="8" rx="4" fill="#FFFFFF" fill-opacity=".22"/>
<rect x="202" y="86" width="52" height="8" rx="4" fill="#FFFFFF" fill-opacity=".22"/>
<rect x="364" y="86" width="72" height="8" rx="4" fill="#FFFFFF" fill-opacity=".22"/>
<rect class="dato d1" x="40" y="106" width="96" height="16" rx="8" fill="#53B0FD"/>
<rect class="dato d2" x="202" y="106" width="78" height="16" rx="8" fill="#72C93C"/>
<rect class="dato d3" x="364" y="106" width="104" height="16" rx="8" fill="#FCCB04"/>
<!-- Gráfico de línea de la producción diaria, sobre un área con degradado. -->
<rect x="24" y="152" width="472" height="166" rx="14" fill="#FFFFFF" fill-opacity=".03"/>
<path d="M40 194H480M40 234H480M40 274H480" stroke="#FFFFFF" stroke-opacity=".07" stroke-dasharray="4 6"/>
<path class="area" d="M40 286C70 280 88 262 116 264S160 286 190 270 236 228 266 232 306 256 336 240 384 196 414 200 456 212 480 186V306H40Z" fill="url(#relleno)"/>
<path class="linea" pathLength="1" d="M40 286C70 280 88 262 116 264S160 286 190 270 236 228 266 232 306 256 336 240 384 196 414 200 456 212 480 186" fill="none" stroke="#53B0FD" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="pulso" cx="480" cy="186" r="6" fill="#FCCB04"/>
<circle class="punto" cx="480" cy="186" r="6" fill="#FCCB04" stroke="#0D2A44" stroke-width="3"/>
<!-- Barras por lote. -->
<rect class="barra b1" x="40" y="356" width="38" height="40" rx="6" fill="#72C93C"/>
<rect class="barra b2" x="96" y="340" width="38" height="56" rx="6" fill="#3A8D47"/>
<rect class="barra b3" x="152" y="364" width="38" height="32" rx="6" fill="#72C93C"/>
<rect class="barra b4" x="208" y="334" width="38" height="62" rx="6" fill="#3A8D47"/>
<rect class="barra b5" x="264" y="348" width="38" height="48" rx="6" fill="#72C93C"/>
<rect class="barra b6" x="320" y="330" width="38" height="66" rx="6" fill="#3A8D47"/>
<rect class="barra b7" x="376" y="352" width="38" height="44" rx="6" fill="#72C93C"/>
<rect class="barra b8" x="432" y="338" width="38" height="58" rx="6" fill="#FCCB04"/>
</svg>
